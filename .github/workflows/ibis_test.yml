name: Ibis Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ibis-framework[duckdb]' pytest pandas

      - name: Run Ibis Tests
        run: |
          # Point pytest directly to your new Ibis test file
          python -m pytest Ibis/test_ibis.py