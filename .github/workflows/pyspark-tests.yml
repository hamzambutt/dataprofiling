name: PySpark Unit Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX: Upgraded to Java 17 to prevent the JAVA_GATEWAY_EXITED crash
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark pytest pandas

      - name: Run PySpark Tests
        env:
          PYSPARK_PYTHON: python3
          PYSPARK_DRIVER_PYTHON: python3
          SPARK_LOCAL_IP: "127.0.0.1"
        run: |
          # Strictly run ONLY the Spark tests
          python -m pytest Spark/test_spark.py